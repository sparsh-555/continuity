<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Continuity has moved</title>
    <meta http-equiv="refresh" content="0; url=https://continuity-api.onrender.com/" />
    <link rel="canonical" href="https://continuity-api.onrender.com/" />
    <script>
      // Keeps the path, which the meta refresh cannot: /projects lands on /projects.
      // `replace` rather than `assign` so Back does not bounce the visitor here again.
      location.replace("https://continuity-api.onrender.com" + location.pathname + location.search + location.hash);
    </script>
    <style>
      body { background: #0d0f0e; color: #e8e6e3; font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; display: grid; place-items: center; min-height: 100vh; margin: 0; }
      a { color: #f0b429; }
    </style>
  </head>
  <body>
    <p>Continuity now lives at <a href="https://continuity-api.onrender.com/">continuity-api.onrender.com</a>.</p>
  </body>
</html>
