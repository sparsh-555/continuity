[project]
name = "continuity"
version = "0.1.0"
description = "Designs a PCB bill of materials and validates the whole board as a graph."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pypdf>=5.0",
    "langgraph>=1.0",
    # Persistence. `psycopg[pool]` arrives with the checkpointer, and `store.py`
    # deliberately shares that one pool rather than opening a second stack.
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
    # Auth.
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["continuity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["continuity"]
